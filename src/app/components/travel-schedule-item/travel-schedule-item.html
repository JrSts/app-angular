<div class="scheculeItemContainer">
    <div class="infos">
        <span class="time">{{travel.horario}}</span>
        <span class="description">{{travel.cidade}}</span>
        <span class="description">{{travel.destino}}</span>
    </div>
    <div class="statusTravel">
        @if(false) {

</div>
