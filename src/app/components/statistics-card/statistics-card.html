<div class="container">
    <div class="headCardContainer">
        <div class="descriptionhead">
            <span class="title">Capacidade</span>
            <h2>Ocupação dos Carros</h2>
        </div>
        <span class="value">{{ value }}%</span>
    </div>
    <div class="progressContainer">
        
        <div class="progress">
            <div
                class="progress__fill"
                [style.width.%]="value">
            </div>
        </div>

        <ul>
            <div class="legendaContainer">
                <span><i class="dotListOcupados"></i>Ocupados <strong>{{ value }}%</strong></span>
                <span><i class="dotListDisponiveis"></i>Disponíveis <strong>{{ 100 - value }}%</strong></span>
            </div>
        </ul>
    </div>
</div>
